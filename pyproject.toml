[project]
name = "saari"
version = "0.1.0"
description = "Agent-driven literature review toolkit (saaristo project)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=1.2",
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.9",
    "umap-learn>=0.5.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic-ai>=0.0.14",
]

[project.urls]
Repository = "https://github.com/Novia-RDI-Seafaring/saari"

[project.scripts]
saari = "saari.cli:app"
saari-mcp = "saari.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The built SPA is copied to src/saari/_ui by the release workflow. It is
# git-ignored, so hatchling needs it declared as an artifact to include it.
[tool.hatch.build]
artifacts = ["src/saari/_ui/"]

[tool.hatch.build.targets.wheel]
packages = ["src/saari"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]
